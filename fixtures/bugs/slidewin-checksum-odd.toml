id = "slidewin-checksum-odd"
project = "slidewin"
category = "logic"
symptom = "test_failure"
root_cause = """
checksum16 in src/window.c adds an odd trailing byte as the low byte instead of the high
byte (data[len - 1] << 8), so odd-length checksums are wrong."""
keywords = [["checksum16", "checksum"], ["odd", "pad", "trailing", "high", "shift", "<< 8", "<<8"]]

[[mutation]]
file = "src/window.c"
find = '''
        sum += (uint32_t)(data[len - 1] << 8);'''
replace = '''
        sum += (uint32_t)data[len - 1];'''
